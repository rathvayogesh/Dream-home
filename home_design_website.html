<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dream Home Design</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #2c3e50;
      color: white;
      padding: 15px;
      text-align: center;
    }

    /* NEW: Attractive Title Style */
    .logo-title {
      margin: 0;
      font-size: 28px;
      font-weight: bold;
      background: linear-gradient(90deg, #2ecc71, #00c6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    }

    nav {
      background: #34495e;
      padding: 10px;
      text-align: center;
    }

    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      color: #2ecc71;
    }

    .hero {
      height: 320px;
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                  url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c');
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      padding: 10px;
    }

    .container {
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
    }

    button {
      background: #2ecc71;
      color: white;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 5px;
      margin: 5px;
    }

    button:hover {
      background: #27ae60;
    }

    .auth-box {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      width: 300px;
    }

    .auth-box input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
    }

    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #2c3e50;
      color: white;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; justify-content:center; gap:10px;">
    <img src="https://cdn-icons-png.flaticon.com/512/69/69524.png" alt="Home Logo" style="width:40px; height:40px;">
    <h1 class="logo-title">Dream Home Design</h1>
  </div>
  <p>Create Your Perfect Home</p>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">Designs</a>
  <a href="#">Contact</a>
  <button onclick="openLogin()">Login</button>
  <button onclick="openSignup()">Sign Up</button>
</nav>

<div class="hero">
  Design Your Dream House
</div>

<div class="container">
  <h2>Popular Designs</h2>
  <div class="cards">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1568605114967-8130f3a36994">
      <div class="card-content">
        <h3>Modern Villa</h3>
        <button onclick="showAlert('Modern Villa')">View</button>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1572120360610-d971b9d7767c">
      <div class="card-content">
        <h3>Luxury House</h3>
        <button onclick="showAlert('Luxury House')">View</button>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1507089947368-19c1da9775ae">
      <div class="card-content">
        <h3>Small Family Home</h3>
        <button onclick="showAlert('Small Family Home')">View</button>
      </div>
    </div>

  </div>
</div>

<!-- Overlay -->
<div class="overlay" onclick="closeAuth()"></div>

<!-- Login Box -->
<div class="auth-box" id="loginBox">
  <h3>Login</h3>
  <input type="text" placeholder="Email">
  <input type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- Signup Box -->
<div class="auth-box" id="signupBox">
  <h3>Sign Up</h3>
  <input type="text" placeholder="Name">
  <input type="text" placeholder="Email">
  <input type="password" placeholder="Password">
  <button onclick="signup()">Create Account</button>
</div>

<footer>
  <p>© 2026 Dream Home Design</p>
</footer>

<script>
  function showAlert(homeType) {
    alert('You selected: ' + homeType);
  }

  function openLogin() {
    document.querySelector('.overlay').style.display = 'block';
    document.getElementById('loginBox').style.display = 'block';
  }

  function openSignup() {
    document.querySelector('.overlay').style.display = 'block';
    document.getElementById('signupBox').style.display = 'block';
  }

  function closeAuth() {
    document.querySelector('.overlay').style.display = 'none';
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('signupBox').style.display = 'none';
  }

  function login() {
    alert('Login Successful (Demo)');
    closeAuth();
  }

  function signup() {
    alert('Account Created (Demo)');
    closeAuth();
  }
</script>

</body>
</html>
